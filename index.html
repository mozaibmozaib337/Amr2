  <!-- Global Anti-Piracy Protection Keyboard Shortcuts -->
  <script>
    document.addEventListener('keydown', function(e) {
      if (
        (e.ctrlKey && (e.key === 's' || e.key === 'u' || e.key === 'p' || e.key === 'c')) ||
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))
      ) {
        e.preventDefault();
        return false;
      }
    });
  </script>
